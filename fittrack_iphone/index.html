<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101a29">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Мой прогресс">
  <meta name="description" content="Простой дневник тренировок, питания, воды, сна и здоровья">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./app.css">
  <title>Мой прогресс — дневник</title>
</head>
<body>
<div class="app-shell">
<header class="topbar">
  <div class="brand"><div class="brand-mark" aria-hidden="true">✦</div><div><span class="eyebrow">ТВОЙ ЛИЧНЫЙ ДНЕВНИК</span><h1>Мой прогресс<span class="accent">.</span></h1></div></div>
  <button class="icon-btn settings-open" aria-label="Настройки" title="Настройки">⚙</button>
</header>
<main id="main" tabindex="-1"></main>
<nav class="bottom-nav" aria-label="Основные разделы">
  <button data-tab="today" class="nav-item active"><span class="nav-ico">⌂</span><span>Сегодня</span></button>
  <button data-tab="workout" class="nav-item"><span class="nav-ico">▰</span><span>Зал</span></button>
  <button data-tab="food" class="nav-item"><span class="nav-ico">◉</span><span>Питание</span></button>
  <button data-tab="health" class="nav-item"><span class="nav-ico">♡</span><span>Здоровье</span></button>
  <button data-tab="progress" class="nav-item"><span class="nav-ico">▥</span><span>Прогресс</span></button>
</nav>
</div>
<div id="modal-root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="import-file" accept="application/json,.json" hidden>
<script src="./app.js" defer></script>
</body>
</html>
